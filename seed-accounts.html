<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Seed Akun — PUD Pasar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 40px; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    p.sub { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 32px; }
    .account { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
    .account .role { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: #2563eb; margin-bottom: 4px; }
    .account .name { font-size: 14px; font-weight: 700; color: #0f172a; }
    .account .cred { font-size: 12px; color: #64748b; margin-top: 4px; font-family: monospace; }
    button { width: 100%; margin-top: 24px; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #log { margin-top: 20px; background: #0f172a; border-radius: 12px; padding: 16px; font-family: monospace; font-size: 12px; color:   #94a3b8; min-height: 80px; white-space: pre-wrap; display: none; }
    #log.show { display: block; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #60a5fa; }
    .warn { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 Seed Akun PUD Pasar</h1>
    <p class="sub">Buat akun demo sekali klik</p>

    <div class="account">
      <div class="role">Super Master Admin</div>
      <div class="name">Super Master Admin</div>
      <div class="cred">📧 supermaster@pudpasar.com</div>
      <div class="cred">🔑 Admin@1234</div>
    </div>

    <div class="account">
      <div class="role">Karyawan</div>
      <div class="name">Demo Karyawan</div>
      <div class="cred">📧 karyawan@pudpasar.com</div>
      <div class="cred">🔑 Karyawan@1234</div>
    </div>

    <button id="btn" onclick="runSeed()">Buat Kedua Akun Sekarang</button>
    <div id="log"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      fetchSignInMethodsForEmail
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // ── Konfigurasi Firebase (sama dengan aplikasi) ──
    const firebaseConfig = {
      projectId: "studio-9813212423-b71a0",
      appId: "1:1077418572142:web:fd1b41362ddce80837a97f",
      apiKey: "AIzaSyCCrAgF_jeIpmDCRN6Gu1NO62DA9efvL7w",
      authDomain: "studio-9813212423-b71a0.firebaseapp.com",
      storageBucket: "studio-9813212423-b71a0.firebasestorage.app",
      messagingSenderId: "1077418572142",
    };

    const FIRESTORE_DB_ID = "ai-studio-absensipudpasar-26fa180a-43ad-4590-abef-e7831b5854f3";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, FIRESTORE_DB_ID);

    const accounts = [
      {
        email: 'supermaster@pudpasar.com',
        password: 'Admin@1234',
        profile: {
          name: 'Super Master Admin',
          role: 'SuperMaster',
          status: 'Active',
          nipp: 'SM-001',
          jabatan: 'Super Master Administrator',
          golongan: 'IV',
        }
      },
      {
        email: 'karyawan@pudpasar.com',
        password: 'Karyawan@1234',
        profile: {
          name: 'Demo Karyawan',
          role: 'Employee',
          status: 'Active',
          nipp: 'EMP-001',
          jabatan: 'Staff Pasar',
          golongan: 'II',
        }
      }
    ];

    const logEl = document.getElementById('log');
    const btn = document.getElementById('btn');

    function log(msg, type = 'info') {
      logEl.classList.add('show');
      logEl.innerHTML += `<span class="${type}">${msg}</span>\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.runSeed = async function() {
      btn.disabled = true;
      btn.textContent = 'Sedang membuat akun...';
      logEl.innerHTML = '';

      for (const account of accounts) {
        log(`\n── Memproses: ${account.email} ──`, 'info');
        try {
          let uid = null;

          // Coba buat akun baru
          try {
            const cred = await createUserWithEmailAndPassword(auth, account.email, account.password);
            uid = cred.user.uid;
            log(`✓ Akun Auth dibuat (UID: ${uid})`, 'ok');
          } catch (authErr) {
            if (authErr.code === 'auth/email-already-in-use') {
              // Akun sudah ada — login untuk ambil UID
              log(`⚠ Email sudah terdaftar, mengambil UID yang ada...`, 'warn');
              const cred = await signInWithEmailAndPassword(auth, account.email, account.password);
              uid = cred.user.uid;
              log(`✓ Login berhasil (UID: ${uid})`, 'ok');
            } else {
              throw authErr;
            }
          }

          // Cek apakah dokumen Firestore sudah ada
          const userRef = doc(db, 'users', uid);
          const existing = await getDoc(userRef);

          if (existing.exists()) {
            log(`⚠ Dokumen Firestore sudah ada, diperbarui...`, 'warn');
          }

          // Tulis/update dokumen Firestore
          await setDoc(userRef, {
            uid,
            email: account.email,
            ...account.profile,
            createdAt: new Date().toISOString(),
          }, { merge: true });

          log(`✓ Profil Firestore tersimpan`, 'ok');
          log(`✓ SELESAI: ${account.profile.name} (${account.profile.role})`, 'ok');

        } catch (err) {
          log(`✗ ERROR: ${err.message}`, 'err');
          if (err.code === 'auth/operation-not-allowed') {
            log(`  → Aktifkan Email/Password di Firebase Console:`, 'err');
            log(`    Authentication → Sign-in method → Email/Password → Enable`, 'err');
          }
        }
      }

      log('\n══════════════════════════════', 'info');
      log('Proses selesai. Coba login di aplikasi!', 'ok');
      btn.textContent = 'Selesai ✓';
      btn.style.background = '#16a34a';
    };
  </script>
</body>
</html>
